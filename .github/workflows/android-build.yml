
name: Build CSKA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p build-src
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP" || exit 1
          unzip -q "$ZIP" -d build-src
          SETTINGS=$(find build-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$SETTINGS" || exit 1
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          test -f gradlew || exit 1
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSKA-Academy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
